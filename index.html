<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TalesRunner Items Database — Equipment Search & Filter</title>
    <meta name="description" content="Browse, search, and filter all TalesRunner Online equipment items. Find items by part, stats, and more.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Animated background particles -->
    <div id="bg-particles"></div>

    <!-- Left Part Sidebar (always visible on desktop, like in-game) -->
    <nav id="part-sidebar">
        <div class="part-sidebar-header">
            <div class="logo-icon">⚔️</div>
            <span class="part-sidebar-title">TalesRunner DB</span>
        </div>
        <div class="part-sidebar-list" id="part-sidebar-list">
            <!-- Part buttons injected by JS -->
        </div>
    </nav>

    <!-- Mobile Part Drawer Toggle -->
    <button id="btn-mobile-parts" class="btn-mobile-parts" title="Parts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    </button>

    <!-- Top Header -->
    <header id="site-header">
        <div class="header-inner">
            <div class="header-left">
                <div class="search-wrapper" id="search-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                    </svg>
                    <input type="text" id="search-input" placeholder="Search items by name..." autocomplete="off">
                    <button class="search-clear" id="search-clear" title="Clear search" aria-label="Clear search">✕</button>
                </div>
            </div>
            <div class="header-right">
                <div class="header-stat-pill" id="pill-total">
                    <span class="pill-label">Total</span>
                    <span class="pill-value" id="stat-total">—</span>
                </div>
                <div class="header-stat-pill" id="pill-showing">
                    <span class="pill-label">Showing</span>
                    <span class="pill-value" id="stat-showing">—</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Top Controls Bar (Sort + Stats Dropdowns) -->
    <section id="controls-bar">
        <div class="controls-inner">
            <!-- Sort dropdown -->
            <div class="top-dropdown">
                <label class="top-dropdown-label">Sort</label>
                <select id="sort-select" class="top-dropdown-select">
                    <option value="rarity-desc" selected>Rarity (Highest)</option>
                    <option value="rarity-asc">Rarity (Lowest)</option>
                    <option value="name-asc">Name (A → Z)</option>
                    <option value="name-desc">Name (Z → A)</option>
                    <option value="stats-desc">Most Stats</option>
                    <option value="stats-asc">Least Stats</option>
                </select>
            </div>

            <!-- Rarity dropdown -->
            <div class="top-dropdown top-dropdown-stats" id="rarity-dropdown-container">
                <label class="top-dropdown-label">Rarity</label>
                <button class="top-dropdown-btn" id="btn-rarity-dropdown">
                    <span id="rarity-dropdown-text">All Rarities</span>
                    <span class="filter-badge" id="rarity-filter-badge" style="display:none;">0</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="chevron-icon"><polyline points="6 9 12 15 18 9"/></svg>
                </button>
                <div class="stats-dropdown-panel" id="rarity-dropdown-panel">
                    <div id="rarity-checkboxes" class="stats-checkboxes-list">
                        <!-- Generated by JS -->
                    </div>
                </div>
            </div>

            <!-- Stats filter dropdown -->
            <div class="top-dropdown top-dropdown-stats">
                <label class="top-dropdown-label">Stats Filter</label>
                <button class="top-dropdown-btn" id="btn-stats-dropdown">
                    <span id="stats-dropdown-text">All Stats</span>
                    <span class="filter-badge" id="filter-badge" style="display:none;">0</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="chevron-icon"><polyline points="6 9 12 15 18 9"/></svg>
                </button>
                <div class="stats-dropdown-panel" id="stats-dropdown-panel">
                    <div class="match-mode-toggle" id="stats-match-mode">
                        <span class="match-mode-label">Match Mode</span>
                        <div class="match-mode-switch">
                            <button class="mode-btn active" data-mode="all">ALL</button>
                            <button class="mode-btn" data-mode="any">ANY</button>
                        </div>
                    </div>
                    <input type="text" class="filter-search-input" id="stats-search" placeholder="Search stats...">
                    <div id="stats-checkboxes" class="stats-checkboxes-list">
                        <!-- Generated by JS -->
                    </div>
                </div>
            </div>

            <!-- Sort by Stat dropdown -->
            <div class="top-dropdown top-dropdown-stats">
                <label class="top-dropdown-label">Sort by Stat</label>
                <button class="top-dropdown-btn" id="btn-sort-stat-dropdown">
                    <span id="sort-stat-dropdown-text">None</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="chevron-icon"><polyline points="6 9 12 15 18 9"/></svg>
                </button>
                <div class="stats-dropdown-panel" id="sort-stat-dropdown-panel">
                    <div class="sort-direction-toggle">
                        <button class="sort-dir-btn active" id="sort-dir-desc" title="Highest first">↓ High → Low</button>
                        <button class="sort-dir-btn" id="sort-dir-asc" title="Lowest first">↑ Low → High</button>
                    </div>
                    <input type="text" class="filter-search-input" id="sort-stat-search" placeholder="Search stat to sort by...">
                    <div id="sort-stat-options" class="stats-checkboxes-list">
                        <!-- Generated by JS -->
                    </div>
                </div>
            </div>

            <!-- Best Full Set dropdown -->
            <div class="top-dropdown top-dropdown-stats">
                <label class="top-dropdown-label">Best Full Set</label>
                <button class="top-dropdown-btn" id="btn-best-set-dropdown">
                    <span id="best-set-dropdown-text">Select Stat</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="chevron-icon"><polyline points="6 9 12 15 18 9"/></svg>
                </button>
                <div class="stats-dropdown-panel" id="best-set-dropdown-panel">
                    <div style="display:flex;gap:8px;margin-bottom:8px;">
                        <input type="number" id="best-set-limit" min="1" max="15" value="5" class="filter-search-input" style="width:60px;" title="Max items per part">
                        <select id="best-set-rarity" class="filter-search-input" style="flex:1;" title="Filter by rarity">
                            <option value="">All Rarities</option>
                        </select>
                    </div>
                    <input type="text" class="filter-search-input" id="best-set-search" placeholder="Search stat...">
                    <div id="best-set-options" class="stats-checkboxes-list">
                        <!-- Generated by JS -->
                    </div>
                </div>
            </div>

            <!-- Column slider -->
            <div class="top-dropdown column-slider-wrap">
                <label class="top-dropdown-label">Columns</label>
                <input type="range" id="col-slider" min="4" max="25" value="18" class="col-slider">
                <span id="col-slider-value" class="col-slider-value">18</span>
            </div>

            <!-- Spacer -->
            <div style="flex:1"></div>

            <!-- Controls -->
            <button class="btn-control" id="btn-reset-filters" title="Reset All Filters">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                <span>Reset</span>
            </button>
            <div class="view-toggle" id="view-toggle">
                <button class="view-btn active" data-view="grid" id="btn-view-grid" title="Grid View">
                    <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                </button>
                <button class="view-btn" data-view="list" id="btn-view-list" title="List View">
                    <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="10" width="18" height="4" rx="1"/><rect x="3" y="16" width="18" height="4" rx="1"/></svg>
                </button>
            </div>
        </div>
    </section>

    <!-- Sidebar overlay (for mobile parts) -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Main Content -->
    <div id="app-layout">
        <main id="main-content">
            <!-- No stat match warning -->
            <div id="no-stat-warning" class="no-stat-warning" style="display:none;"></div>

            <!-- Best Full Set results -->
            <div id="best-set-results" class="best-set-results" style="display:none;"></div>

            <!-- Active filters display -->
            <div id="active-filters" class="active-filters-hidden">
                <div class="active-filters-inner" id="active-filters-inner"></div>
            </div>

            <!-- Items Grid -->
            <div id="items-container" class="items-grid">
                <!-- Items injected by JS -->
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="empty-state" style="display:none;">
                <div class="empty-icon">🔍</div>
                <h3>No items found</h3>
                <p>Try adjusting your search or filters</p>
            </div>

            <!-- Loading -->
            <div id="loading-state" class="loading-state">
                <div class="spinner"></div>
                <p>Loading items...</p>
            </div>

            <!-- Pagination -->
            <nav id="pagination-nav" aria-label="Page navigation">
                <div class="pagination-info" id="pagination-info"></div>
                <div class="pagination-controls" id="pagination-controls"></div>
            </nav>
        </main>
    </div>

    <!-- Item Detail Modal -->
    <div id="item-modal" class="modal-overlay" style="display:none;">
        <div class="modal-card" id="modal-card">
            <button class="modal-close" id="modal-close" aria-label="Close modal">✕</button>
            <div class="modal-body">
                <div class="modal-image-wrap">
                    <img id="modal-img" src="" alt="">
                </div>
                <div class="modal-info">
                    <h2 id="modal-name"></h2>
                    <div class="modal-meta">
                        <span class="modal-part-badge" id="modal-part"></span>
                    </div>
                    <div class="modal-stats" id="modal-stats"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Back to top -->
    <button id="btn-back-top" class="btn-back-top" title="Back to top" aria-label="Back to top" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"/></svg>
    </button>

    <script src="script.js"></script>
</body>
</html>
