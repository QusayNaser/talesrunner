<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TalesRunner Items Database — Equipment Search & Filter</title>
    <meta name="description" content="Browse, search, and filter all TalesRunner Online equipment items. Find items by part, stats, and more.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Animated background particles -->
    <div id="bg-particles"></div>

    <!-- Header -->
    <header id="site-header">
        <div class="header-inner">
            <div class="logo-group">
                <div class="logo-icon">⚔️</div>
                <div>
                    <h1 id="main-heading">TalesRunner DB</h1>
                    <p class="tagline">Equipment Database</p>
                </div>
            </div>
            <div class="header-stats">
                <div class="header-stat-pill" id="pill-total">
                    <span class="pill-label">Total</span>
                    <span class="pill-value" id="stat-total">—</span>
                </div>
                <div class="header-stat-pill" id="pill-showing">
                    <span class="pill-label">Showing</span>
                    <span class="pill-value" id="stat-showing">—</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Search & Controls Bar -->
    <section id="controls-bar">
        <div class="controls-inner">
            <div class="search-wrapper" id="search-wrapper">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                </svg>
                <input type="text" id="search-input" placeholder="Search items by name..." autocomplete="off">
                <button class="search-clear" id="search-clear" title="Clear search" aria-label="Clear search">✕</button>
            </div>
            <div class="controls-actions">
                <button class="btn-control" id="btn-toggle-filters" title="Toggle Filters">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
                    <span>Filters</span>
                    <span class="filter-badge" id="filter-badge" style="display:none;">0</span>
                </button>
                <button class="btn-control" id="btn-reset-filters" title="Reset All Filters">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                    <span>Reset</span>
                </button>
                <div class="view-toggle" id="view-toggle">
                    <button class="view-btn active" data-view="grid" id="btn-view-grid" title="Grid View">
                        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                    </button>
                    <button class="view-btn" data-view="list" id="btn-view-list" title="List View">
                        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="10" width="18" height="4" rx="1"/><rect x="3" y="16" width="18" height="4" rx="1"/></svg>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Part/Slot Badges -->
        <div class="part-badges-container">
            <div class="part-badges-scroll" id="part-badges-container">
                <!-- Badges injected by JS -->
            </div>
        </div>
    </section>

    <!-- Sidebar Filters (outside app-layout to avoid stacking context) -->
        <aside id="filter-sidebar">
            <div class="sidebar-header">
                <h2>Filters</h2>
                <button class="btn-close-sidebar" id="btn-close-sidebar" aria-label="Close filters">✕</button>
            </div>
            <div class="sidebar-content">


                <!-- Stats Filters -->
                <div class="filter-group" id="fg-stats">
                    <div class="filter-group-header">
                        <span class="filter-group-title">Stats</span>
                        <span class="filter-group-count" id="stats-count">0</span>
                    </div>
                    <div class="filter-group-body open" id="filter-stats-list">
                        <input type="text" class="filter-search-input" id="stats-search" placeholder="Search stats...">
                        <div id="stats-checkboxes">
                            <!-- Generated by JS -->
                        </div>
                    </div>
                </div>



                <!-- Sort -->
                <div class="filter-group" id="fg-sort">
                    <div class="filter-group-header">
                        <span class="filter-group-title">Sort By</span>
                    </div>
                    <div class="filter-group-body open" id="filter-sort-body">
                        <select id="sort-select" class="filter-select">
                            <option value="name-asc">Name (A → Z)</option>
                            <option value="name-desc">Name (Z → A)</option>
                            <option value="stats-desc">Most Stats</option>
                            <option value="stats-asc">Least Stats</option>
                        </select>
                    </div>
                </div>

                <!-- Sort by Stat -->
                <div class="filter-group" id="fg-sort-stat">
                    <div class="filter-group-header">
                        <span class="filter-group-title">Sort by Stat Value</span>
                    </div>
                    <div class="filter-group-body open" id="filter-sort-stat-body">
                        <input type="text" class="filter-search-input" id="sort-stat-search" placeholder="Search stat to sort by...">
                        <div class="sort-direction-toggle">
                            <button class="sort-dir-btn active" id="sort-dir-desc" title="Highest first">↓ High → Low</button>
                            <button class="sort-dir-btn" id="sort-dir-asc" title="Lowest first">↑ Low → High</button>
                        </div>
                        <div id="sort-stat-options" class="sort-stat-options">
                            <!-- Generated by JS -->
                        </div>
                    </div>
                </div>
            </div>
        </aside>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Filter Sidebar + Main Content -->
    <div id="app-layout">
        <!-- Main Content -->
        <main id="main-content">
            <!-- Active filters display -->
            <div id="active-filters" class="active-filters-hidden">
                <div class="active-filters-inner" id="active-filters-inner"></div>
            </div>

            <!-- Items Grid -->
            <div id="items-container" class="items-grid">
                <!-- Items injected by JS -->
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="empty-state" style="display:none;">
                <div class="empty-icon">🔍</div>
                <h3>No items found</h3>
                <p>Try adjusting your search or filters</p>
            </div>

            <!-- Loading -->
            <div id="loading-state" class="loading-state">
                <div class="spinner"></div>
                <p>Loading items...</p>
            </div>

            <!-- Pagination -->
            <nav id="pagination-nav" aria-label="Page navigation">
                <div class="pagination-info" id="pagination-info"></div>
                <div class="pagination-controls" id="pagination-controls"></div>
            </nav>
        </main>
    </div>

    <!-- Item Detail Modal -->
    <div id="item-modal" class="modal-overlay" style="display:none;">
        <div class="modal-card" id="modal-card">
            <button class="modal-close" id="modal-close" aria-label="Close modal">✕</button>
            <div class="modal-body">
                <div class="modal-image-wrap">
                    <img id="modal-img" src="" alt="">
                </div>
                <div class="modal-info">
                    <h2 id="modal-name"></h2>
                    <div class="modal-meta">
                        <span class="modal-part-badge" id="modal-part"></span>
                    </div>
                    <div class="modal-stats" id="modal-stats"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Back to top -->
    <button id="btn-back-top" class="btn-back-top" title="Back to top" aria-label="Back to top" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"/></svg>
    </button>

    <script src="script.js"></script>
</body>
</html>
